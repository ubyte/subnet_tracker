[project]
name = "subnet-tracker"
version = "0.1.0"
description = "Domain-based split tunnel for OpenVPN: tracks domain addresses and pushes routes to their networks"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "dnspython[doh]>=2.6",
    "httpx>=0.27",
    "idna>=3.7",
    "publicsuffixlist>=1.0",
    "cryptography>=43",
]

[project.scripts]
subnet-tracker = "subnet_tracker.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-waitress>=3.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 200
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PIE", "RET", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["subnet_tracker.types.Seconds", "subnet_tracker.types.Bytes", "subnet_tracker.types.ReconnectMode", "subnet_tracker.core.settings.BrowserRefreshMode", "subnet_tracker.core.settings.ApplyStrategy", "subnet_tracker.cli.command.Runtime"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
